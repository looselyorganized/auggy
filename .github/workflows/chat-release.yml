name: Build & publish chat dist on tag

on:
  push:
    tags:
      - "v*"

jobs:
  build-chat-dist:
    name: Build chat package + upload as release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install runtime deps
        run: bun install

      - name: Install chat package deps
        working-directory: chat
        run: bun install

      - name: Build chat dist
        working-directory: chat
        run: bun run build

      - name: Verify dist contents
        run: |
          test -f chat/dist/index.html
          test -d chat/dist/assets

      - name: Package chat dist into tarball
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd chat && tar -czvf "../chat-dist-${REF_NAME}.tar.gz" dist/
          cd ..
          shasum -a 256 "chat-dist-${REF_NAME}.tar.gz" > "chat-dist-${REF_NAME}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.1
        with:
          files: |
            chat-dist-${{ github.ref_name }}.tar.gz
            chat-dist-${{ github.ref_name }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
