name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: v1 lint gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

  typecheck:
    name: v1 typecheck gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  temporal_example:
    name: Temporal example gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install, test, typecheck, and audit Temporal example
        run: bun run test:temporal-example

  pricing:
    name: v1 pricing gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pricing freshness check
        run: bun run scripts/check-pricing-freshness.ts

  inventory:
    name: v1 test-surface inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.surface.outputs.runtime }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Validate tracked test surface
        id: surface
        run: |
          bun scripts/test-surface-inventory.ts check
          echo "runtime=$(bun scripts/test-surface-inventory.ts matrix runtime)" >> "$GITHUB_OUTPUT"

  console:
    name: v1 console gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate creator console
        working-directory: admin
        run: bun run lint

      - name: Run inventoried creator console tests
        run: bun scripts/test-surface-inventory.ts run console

      - name: Build creator console
        run: bun run build:admin

  deterministic_tests:
    name: v1 deterministic runtime gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic v1 tests
        run: |
          bun scripts/test-surface-inventory.ts run-runtime-files \
            tests/cli/create-installs-deps.test.ts \
            tests/cli/add-installs-deps.test.ts \
            tests/cli/commands/augment.test.ts \
            tests/cli/commands/mcp.test.ts \
            tests/cli/commands/run.test.ts \
            tests/cli/commands/doctor.test.ts \
            tests/cli/commands/logs.test.ts \
            tests/cli/mcp-config.test.ts \
            tests/cli/deploy.test.ts \
            tests/cli/deploy/bundle.test.ts \
            tests/cli/deploy/dockerfile.test.ts \
            tests/cli/deploy/health.test.ts \
            tests/cli/deploy/railway-cli.test.ts \
            tests/cli/deploy/secrets.test.ts \
            tests/cli/console-chat-config.test.ts \
            tests/cli/scaffold-package-json.test.ts \
            tests/cli/model-picker.test.ts \
            tests/kernel/thread-history-persistence.test.ts \
            tests/transports/admin/admin-static.test.ts \
            tests/transports/admin/console-chat-store.test.ts \
            tests/transports/admin/console-chat-routes.test.ts \
            tests/transports/web-console-persistence.test.ts \
            tests/augments/mcp.test.ts \
            tests/augments/knowledge.test.ts \
            tests/augments/notify.test.ts \
            tests/augments/telegram-transport.test.ts \
            tests/engines/anthropic.test.ts \
            tests/engines/openai.test.ts \
            tests/engines/openrouter.test.ts \
            tests/engines/ollama.test.ts
        env:
          # Tests that need a model use a mock — no real API key in CI.
          ANTHROPIC_API_KEY: sk-ant-mock-do-not-use
          OPENAI_API_KEY: sk-mock-do-not-use

  linux_boundaries:
    name: v1 Linux boundary gate (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: filesystem
            test: tests/augments/filesystem.test.ts
          - name: managed-files
            test: tests/transports/admin/admin-managed-files.test.ts
          - name: overrides
            test: tests/lib/admin-overrides.test.ts
          - name: resolver
            test: tests/cli/augment-resolver.test.ts

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exercise Linux security boundary
        env:
          TEST_PATH: ${{ matrix.test }}
        run: bun scripts/test-surface-inventory.ts run-runtime-files "$TEST_PATH"

  runtime_shards:
    name: v1 runtime shard (${{ matrix.shard }})
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.inventory.outputs.runtime) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run sequential runtime shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: bun scripts/test-surface-inventory.ts run "$TEST_SHARD"

  postgres_coordination:
    name: v1 PostgreSQL coordination gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run PostgreSQL coordination integration tests
        env:
          AUGGY_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
        run: bun scripts/test-surface-inventory.ts run-runtime-files tests/coordination/postgres-distributed-turn-coordinator.test.ts

  test:
    name: v1 release gate
    if: always()
    needs:
      - lint
      - typecheck
      - pricing
      - inventory
      - console
      - deterministic_tests
      - linux_boundaries
      - runtime_shards
      - postgres_coordination
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify constituent gates
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          PRICING_RESULT: ${{ needs.pricing.result }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          TEST_RESULT: ${{ needs.deterministic_tests.result }}
          LINUX_RESULT: ${{ needs.linux_boundaries.result }}
          SHARD_RESULT: ${{ needs.runtime_shards.result }}
          POSTGRES_COORDINATION_RESULT: ${{ needs.postgres_coordination.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TYPECHECK_RESULT" != "success" || "$PRICING_RESULT" != "success" || "$INVENTORY_RESULT" != "success" || "$CONSOLE_RESULT" != "success" || "$TEST_RESULT" != "success" || "$LINUX_RESULT" != "success" || "$SHARD_RESULT" != "success" || "$POSTGRES_COORDINATION_RESULT" != "success" ]]; then
            echo "lint=$LINT_RESULT typecheck=$TYPECHECK_RESULT pricing=$PRICING_RESULT inventory=$INVENTORY_RESULT console=$CONSOLE_RESULT deterministic-tests=$TEST_RESULT linux-boundaries=$LINUX_RESULT runtime-shards=$SHARD_RESULT postgres-coordination=$POSTGRES_COORDINATION_RESULT"
            exit 1
          fi
