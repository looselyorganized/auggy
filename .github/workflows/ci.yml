name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: v1 release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Validate creator console
        working-directory: admin
        run: |
          bun run lint
          bun test

      - name: Build creator console
        run: bun run build:admin

      - name: Pricing freshness check
        run: bun run scripts/check-pricing-freshness.ts

      - name: Run deterministic v1 tests
        run: |
          bun test --max-concurrency=1 \
            tests/cli/create-installs-deps.test.ts \
            tests/cli/add-installs-deps.test.ts \
            tests/cli/commands/augment.test.ts \
            tests/cli/commands/mcp.test.ts \
            tests/cli/commands/run.test.ts \
            tests/cli/commands/doctor.test.ts \
            tests/cli/commands/logs.test.ts \
            tests/cli/mcp-config.test.ts \
            tests/cli/deploy.test.ts \
            tests/cli/deploy/bundle.test.ts \
            tests/cli/deploy/dockerfile.test.ts \
            tests/cli/deploy/health.test.ts \
            tests/cli/deploy/railway-cli.test.ts \
            tests/cli/deploy/secrets.test.ts \
            tests/cli/console-chat-config.test.ts \
            tests/cli/scaffold-package-json.test.ts \
            tests/cli/model-picker.test.ts \
            tests/kernel/thread-history-persistence.test.ts \
            tests/transports/admin/admin-static.test.ts \
            tests/transports/admin/console-chat-store.test.ts \
            tests/transports/admin/console-chat-routes.test.ts \
            tests/transports/web-console-persistence.test.ts \
            tests/augments/mcp.test.ts \
            tests/augments/knowledge.test.ts \
            tests/augments/notify.test.ts \
            tests/augments/telegram-transport.test.ts \
            tests/engines/anthropic.test.ts \
            tests/engines/openai.test.ts \
            tests/engines/openrouter.test.ts \
            tests/engines/ollama.test.ts
        env:
          # Tests that need a model use a mock — no real API key in CI.
          ANTHROPIC_API_KEY: sk-ant-mock-do-not-use
          OPENAI_API_KEY: sk-mock-do-not-use
