name: AgentMail provider canary

# This workflow has no push, pull_request, repository_dispatch, or scheduled
# trigger. Dispatch it manually from canonical main only after the protected
# agentmail-provider-canary Environment is configured and approved.
# The first approved run creates one persistent canary inbox in that
# Environment's AgentMail account; every later run reuses the same inbox.
on:
  workflow_dispatch:

concurrency:
  group: agentmail-provider-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Existing-account idempotency canary
    if: github.repository == 'looselyorganized/auggy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agentmail-provider-canary

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Create or reuse one persistent canary inbox twice
        env:
          # Configure this name only on the protected Environment. Do not add
          # a repository-level fallback secret with the same name.
          AGENTMAIL_CANARY_ACCOUNT_API_KEY_ENV_ONLY: ${{ secrets.AGENTMAIL_CANARY_ACCOUNT_API_KEY_ENV_ONLY }}
        run: bun run canary:agentmail
