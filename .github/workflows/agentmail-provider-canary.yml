name: AgentMail provider canary

# This workflow has no push, pull_request, repository_dispatch, or scheduled
# trigger. Dispatch it manually from canonical main only after the protected
# agentmail-provider-canary Environment is configured and approved.
# Every run connects to one pre-provisioned canary inbox with the exact protected
# runtime key and exercises the shipped read-only REST/WebSocket adapters. It
# does not sign up, create an inbox, create or rotate a key, create a draft, or
# send mail.
on:
  workflow_dispatch:

concurrency:
  group: agentmail-provider-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Pre-provisioned inbox runtime-path canary
    if: github.repository == 'looselyorganized/auggy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agentmail-provider-canary

    steps:
      - name: Checkout approved dispatch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Pin the exact commit selected at dispatch so Environment approval
          # cannot be followed by a moving-main checkout.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Verify pre-provisioned inbox and runtime adapters with the supplied key
        env:
          # Configure these only on the protected Environment. The key is
          # passed unchanged through the canonical runtime variable.
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_CANARY_RUNTIME_API_KEY }}
          AGENTMAIL_CANARY_INBOX_ID: ${{ vars.AGENTMAIL_CANARY_INBOX_ID }}
          AGENTMAIL_CANARY_INBOX_EMAIL: ${{ vars.AGENTMAIL_CANARY_INBOX_EMAIL }}
        run: bun scripts/agentmail-provider-canary.ts
