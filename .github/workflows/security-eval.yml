name: Security eval

# This workflow runs Auggy's portable security eval suite against the test
# fixture using a real Anthropic API call per case. To keep maintainer costs and
# model-drift noise out of the public CI badge, it is manual-only.
#
# Maintainers click "Run workflow" against any branch to verify a PR before
# merging. Optional `config` input lets you point at a different fixture
# (e.g. evals/security/fixtures/test-agent-sonnet.yaml for a Sonnet comparison
# run).
#
# Contributors who want PR-time validation in their own fork: configure
# ANTHROPIC_API_KEY_SECURITY_EVAL in your fork's repo secrets, then add the
# trigger you want in your fork's workflow file. Your fork, your CI, your spend.
# See CONTRIBUTING.md.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Agent config path (default: Haiku fixture). Use evals/security/fixtures/test-agent-sonnet.yaml for Sonnet, etc."
        required: false
        default: "evals/security/fixtures/test-agent.yaml"

concurrency:
  group: security-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-eval:
    name: Security eval (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security eval against fixture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SECURITY_EVAL }}
          # The value is passed through env (not interpolated into the run-line)
          # per GitHub Actions security guidance — input never reaches the shell
          # as code.
          CONFIG_PATH: ${{ inputs.config }}
        run: bun run evals/security/run.ts --config "$CONFIG_PATH"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-eval-results
          path: evals/security/results/
          retention-days: 30
