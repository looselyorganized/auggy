name: Security eval

on:
  pull_request:
    branches: [main]

concurrency:
  group: security-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-eval:
    name: Security eval (fixture, Haiku, per-PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security eval against fixture
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SECURITY_EVAL }}
        run: bun run evals/security/run.ts

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: security-eval-results
          path: evals/security/results/
          retention-days: 30
