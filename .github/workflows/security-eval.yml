name: Trusted security eval

# repository_dispatch workflows are loaded only from the default branch. The
# caller supplies passive metadata; candidate workflow code, scripts, and
# dependencies are never loaded or executed. One fixed-path candidate fixture
# is fetched as bounded passive data and must exactly match the trusted copy.

on:
  repository_dispatch:
    types: [security-eval-request]

concurrency:
  group: trusted-security-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-eval:
    name: Trusted security eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: security-eval
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Materialize bounded request data
        env:
          REQUEST_JSON: ${{ toJson(github.event.client_payload) }}
          REQUEST_PATH: ${{ runner.temp }}/security-eval-request.json
        run: |
          printf '%s' "$REQUEST_JSON" \
            | head -c 4097 \
            > "$REQUEST_PATH"
          if [ "$(wc -c < "$REQUEST_PATH")" -gt 4096 ]; then
            echo "::error::Security eval request exceeds the byte limit."
            exit 1
          fi

      - name: Validate request with trusted code
        id: request
        env:
          REQUEST_PATH: ${{ runner.temp }}/security-eval-request.json
        run: >-
          bun run scripts/validate-security-eval-request.ts
          --request "$REQUEST_PATH"
          >> "$GITHUB_OUTPUT"

      - name: Confirm source commit exists in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          resolved_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" --jq '.sha')"
          if [ "$resolved_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Security eval source SHA is not an exact repository commit."
            exit 1
          fi

      - name: Fetch bounded candidate configuration as passive data
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          CONFIG_PATH: ${{ steps.request.outputs.config_path }}
          CANDIDATE_CONFIG_PATH: ${{ runner.temp }}/security-eval-candidate.yaml
        run: |
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${CONFIG_PATH}?ref=${SOURCE_SHA}" \
            --jq '[.type, .encoding, .size] | @tsv')"
          IFS=$'\t' read -r object_type encoding size <<< "$metadata"
          if [ "$object_type" != "file" ] || [ "$encoding" != "base64" ] \
            || ! [[ "$size" =~ ^[0-9]+$ ]] || [ "$size" -gt 65536 ]; then
            echo "::error::Candidate security-eval configuration is unavailable or exceeds 65536 bytes."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/contents/${CONFIG_PATH}?ref=${SOURCE_SHA}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > "$CANDIDATE_CONFIG_PATH"
          if [ "$(wc -c < "$CANDIDATE_CONFIG_PATH")" -ne "$size" ]; then
            echo "::error::Candidate security-eval configuration changed during retrieval."
            exit 1
          fi

      - name: Verify candidate configuration with trusted code
        id: candidate
        env:
          CANDIDATE_CONFIG_PATH: ${{ runner.temp }}/security-eval-candidate.yaml
          CONFIG_PATH: ${{ steps.request.outputs.config_path }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: >-
          bun run scripts/verify-security-eval-candidate.ts
          --candidate "$CANDIDATE_CONFIG_PATH"
          --trusted "$CONFIG_PATH"
          --source-sha "$SOURCE_SHA"
          >> "$GITHUB_OUTPUT"

      - name: Run trusted security eval
        env:
          # Configure this name only on the protected security-eval Environment.
          # Absence fails closed instead of falling back to the legacy repo secret.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SECURITY_EVAL_ENV_ONLY }}
          CONFIG_PATH: ${{ steps.request.outputs.config_path }}
          SECURITY_EVAL_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          SECURITY_EVAL_CONFIG_SHA256: ${{ steps.candidate.outputs.candidate_config_sha256 }}
          SECURITY_EVAL_SCOPE: ${{ steps.candidate.outputs.evaluation_scope }}
        run: bun run packages/evals/src/security/run.ts --config "$CONFIG_PATH"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-eval-results-${{ github.run_id }}
          path: packages/evals/src/security/results/
          if-no-files-found: ignore
          retention-days: 30
