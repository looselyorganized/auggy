name: Security eval request

# This branch-selectable workflow is deliberately untrusted and secretless. It
# never checks out or executes repository content. It emits only a bounded
# model enum and the triggering commit SHA. The default-branch-only
# security-eval-trusted.yml workflow validates that data and runs the trusted
# harness with the paid key.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Trusted fixture model"
        required: true
        type: choice
        default: haiku
        options:
          - haiku
          - sonnet

concurrency:
  group: security-eval-request-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  request:
    name: Create bounded eval request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write passive request data
        env:
          REQUEST_MODEL: ${{ inputs.model }}
          REQUEST_SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir security-eval-request
          printf '{"schema":1,"model":"%s","sourceSha":"%s"}\n' \
            "$REQUEST_MODEL" "$REQUEST_SOURCE_SHA" \
            > security-eval-request/request.json

      - name: Upload request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-eval-request
          path: security-eval-request/request.json
          if-no-files-found: error
          retention-days: 1
