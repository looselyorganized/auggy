name: Trusted security eval

# repository_dispatch workflows are loaded only from the default branch. The
# caller supplies passive metadata; candidate branch workflow code, scripts,
# dependencies, configs, and paths are never loaded or executed.

on:
  repository_dispatch:
    types: [security-eval-request]

concurrency:
  group: trusted-security-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-eval:
    name: Trusted security eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: security-eval
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Materialize bounded request data
        env:
          REQUEST_JSON: ${{ toJson(github.event.client_payload) }}
          REQUEST_PATH: ${{ runner.temp }}/security-eval-request.json
        run: |
          printf '%s' "$REQUEST_JSON" \
            | head -c 4097 \
            > "$REQUEST_PATH"
          if [ "$(wc -c < "$REQUEST_PATH")" -gt 4096 ]; then
            echo "::error::Security eval request exceeds the byte limit."
            exit 1
          fi

      - name: Validate request with trusted code
        id: request
        env:
          REQUEST_PATH: ${{ runner.temp }}/security-eval-request.json
        run: >-
          bun run scripts/validate-security-eval-request.ts
          --request "$REQUEST_PATH"
          >> "$GITHUB_OUTPUT"

      - name: Confirm source commit exists in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          resolved_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" --jq '.sha')"
          if [ "$resolved_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Security eval source SHA is not an exact repository commit."
            exit 1
          fi

      - name: Run trusted security eval
        env:
          # Configure this name only on the protected security-eval Environment.
          # Absence fails closed instead of falling back to the legacy repo secret.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SECURITY_EVAL_ENV_ONLY }}
          CONFIG_PATH: ${{ steps.request.outputs.config_path }}
        run: bun run packages/evals/src/security/run.ts --config "$CONFIG_PATH"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-eval-results-${{ github.run_id }}
          path: packages/evals/src/security/results/
          if-no-files-found: ignore
          retention-days: 30
