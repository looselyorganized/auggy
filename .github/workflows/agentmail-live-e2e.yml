name: AgentMail live mutation E2E

# Manual, protected, exact-main proof. This creates one temporary sender inbox,
# sends two bounded canary messages, exercises Auggy's real inbound/review/send
# runtime, and deletes the temporary inbox and canary messages.
on:
  workflow_dispatch:

concurrency:
  group: agentmail-live-mutation-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-e2e:
    name: Live send, receive, draft, approve, and reply
    if: github.repository == 'looselyorganized/auggy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: agentmail-provider-canary

    steps:
      - name: Checkout approved dispatch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Exercise live AgentMail mutations through Auggy
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_CANARY_ACCOUNT_API_KEY_ENV_ONLY }}
          AGENTMAIL_CANARY_INBOX_ID: ${{ vars.AGENTMAIL_CANARY_INBOX_ID }}
          AGENTMAIL_CANARY_INBOX_EMAIL: ${{ vars.AGENTMAIL_CANARY_INBOX_EMAIL }}
          AGENTMAIL_LIVE_MUTATION_CONFIRM: create-temporary-inbox-and-send-live-email
        run: bun scripts/agentmail-live-e2e.ts
