name: Trusted security eval

# GitHub loads a workflow_run workflow from the default branch. Candidate
# branches can request an eval, but cannot change this harness or receive its
# environment-scoped API key. Candidate content is never checked out.

on:
  workflow_run:
    workflows: ["Security eval request"]
    types: [completed]

concurrency:
  group: trusted-security-eval-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  security-eval:
    name: Trusted security eval
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: security-eval
    env:
      ARTIFACT_MAX_BYTES: 4096
      ARTIFACT_MAX_ARCHIVE_BYTES: 8192
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Bound request artifact before download
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUEST_RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "security-eval-request" and .expired == false)]')"
          artifact_count="$(jq 'length' <<<"$artifact_json")"
          if [ "$artifact_count" -ne 1 ]; then
            echo "::error::Expected exactly one security-eval-request artifact."
            exit 1
          fi
          artifact_size="$(jq -r '.[0].size_in_bytes' <<<"$artifact_json")"
          if [ "$artifact_size" -gt "$ARTIFACT_MAX_ARCHIVE_BYTES" ]; then
            echo "::error::Security eval request archive exceeds the byte limit."
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' <<<"$artifact_json")"
          if ! [[ "$artifact_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Security eval request artifact id is invalid."
            exit 1
          fi
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download and bound passive request data
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          REQUEST_ARCHIVE: ${{ runner.temp }}/security-eval-request.zip
          REQUEST_DIRECTORY: ${{ runner.temp }}/security-eval-request
        run: |
          set +o pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            | head -c "$((ARTIFACT_MAX_ARCHIVE_BYTES + 1))" \
            > "$REQUEST_ARCHIVE"
          download_status="${PIPESTATUS[0]}"
          set -o pipefail
          archive_size="$(wc -c < "$REQUEST_ARCHIVE")"
          if [ "$archive_size" -gt "$ARTIFACT_MAX_ARCHIVE_BYTES" ]; then
            echo "::error::Security eval request archive exceeds the byte limit."
            exit 1
          fi
          if [ "$download_status" -ne 0 ]; then
            echo "::error::Security eval request archive download failed."
            exit 1
          fi
          entries="$(unzip -Z1 "$REQUEST_ARCHIVE")"
          if [ "$entries" != "request.json" ]; then
            echo "::error::Security eval request archive has an invalid file list."
            exit 1
          fi
          mkdir "$REQUEST_DIRECTORY"
          unzip -p "$REQUEST_ARCHIVE" request.json \
            | head -c "$((ARTIFACT_MAX_BYTES + 1))" \
            > "$REQUEST_DIRECTORY/request.json"
          request_size="$(wc -c < "$REQUEST_DIRECTORY/request.json")"
          if [ "$request_size" -gt "$ARTIFACT_MAX_BYTES" ]; then
            echo "::error::Security eval request exceeds the byte limit."
            exit 1
          fi

      - name: Validate request with trusted code
        id: request
        env:
          REQUEST_PATH: ${{ runner.temp }}/security-eval-request/request.json
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          bun run scripts/validate-security-eval-request.ts
          --request "$REQUEST_PATH"
          --expected-sha "$EXPECTED_SOURCE_SHA"
          >> "$GITHUB_OUTPUT"

      - name: Run trusted security eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_SECURITY_EVAL }}
          CONFIG_PATH: ${{ steps.request.outputs.config_path }}
        run: bun run packages/evals/src/security/run.ts --config "$CONFIG_PATH"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-eval-results-${{ github.event.workflow_run.id }}
          path: packages/evals/src/security/results/
          if-no-files-found: ignore
          retention-days: 30
