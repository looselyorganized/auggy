name: Publish auggy + engine packages to npm on tag

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

# All packages version-lock together: one tag → one version across
# `auggy`, `@auggy/anthropic`, `@auggy/openai`, `@auggy/openrouter`,
# `@auggy/ollama`. Each package's package.json version MUST equal the
# tag suffix; the workflow fails fast if any drift.
#
# Per-package already-published checks mean retroactive tags are
# idempotent — if a package@X.Y.Z is already on npm, that publish is
# skipped while siblings still publish if they're new. Useful when a
# previous run failed mid-flight and we need to retry.
#
# Order: engines FIRST (so a fresh `npm i -g auggy@X.Y.Z` followed by
# `auggy create` resolves engine deps from npm), then `auggy` core.

jobs:
  publish:
    name: Publish auggy + engine packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node (for `npm publish`)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Confirm tag commit belongs to main
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag commit $TAG_COMMIT is not reachable from origin/main."
            exit 1
          fi

      # Every package's package.json version must equal the tag suffix.
      # Catches drift between `auggy` and the engine packages — they
      # version together; a partial bump is a release-PR bug.
      - name: Confirm all package versions match tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"
          for pkg in "package.json" \
                    "packages/anthropic/package.json" \
                    "packages/openai/package.json" \
                    "packages/openrouter/package.json" \
                    "packages/ollama/package.json" \
                    "packages/evals/package.json"; do
            PKG_VERSION="$(node -p "require('./$pkg').version")"
            PKG_NAME="$(node -p "require('./$pkg').name")"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$PKG_NAME ($pkg) version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
              exit 1
            fi
            echo "  $PKG_NAME @ $PKG_VERSION OK"
          done

      - name: Smoke packed release
        env:
          AUGGY_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: bun run smoke:release

      # Publish engines first, then core. Order matters: a fresh user
      # doing `npm i -g auggy@<tag>` immediately followed by `auggy
      # create` needs the engine packages already on npm so `bun
      # install` in the scaffolded agent resolves them.
      #
      # Per-package idempotency: `npm view` checks the registry; if the
      # version is already published, skip that package and continue.
      # This makes retroactive tags safe — only newly-bumped packages
      # actually publish.
      #
      # Provenance attestation (--provenance) is currently DISABLED
      # because it requires a public source repo. Re-enable when the
      # augment-1 repo is made public for OSS launch.
      # See docs/RELEASING.md § "Provenance gate".
      - name: Publish engines first, then auggy core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"

          publish_pkg() {
            local pkg_dir="$1"
            local tarball="$2"
            local pkg_name
            pkg_name="$(node -p "require('./$pkg_dir/package.json').name")"
            if [ ! -f "$tarball" ]; then
              echo "::error::Missing verified release artifact: $tarball"
              exit 1
            fi
            if npm view "$pkg_name@$TAG_VERSION" version >/dev/null 2>&1; then
              echo "  $pkg_name@$TAG_VERSION already on npm; skipping"
            else
              echo "  publishing verified $pkg_name@$TAG_VERSION artifact"
              npm publish "$tarball" --access public
            fi
          }

          echo "-- Engine packages first --"
          publish_pkg "packages/anthropic" "$RUNNER_TEMP/release-artifacts/auggy-anthropic-$TAG_VERSION.tgz"
          publish_pkg "packages/openai" "$RUNNER_TEMP/release-artifacts/auggy-openai-$TAG_VERSION.tgz"
          publish_pkg "packages/openrouter" "$RUNNER_TEMP/release-artifacts/auggy-openrouter-$TAG_VERSION.tgz"
          publish_pkg "packages/ollama" "$RUNNER_TEMP/release-artifacts/auggy-ollama-$TAG_VERSION.tgz"

          echo "-- @auggy/evals --"
          publish_pkg "packages/evals" "$RUNNER_TEMP/release-artifacts/auggy-evals-$TAG_VERSION.tgz"

          echo "-- auggy core last --"
          publish_pkg "." "$RUNNER_TEMP/release-artifacts/auggy-$TAG_VERSION.tgz"
