name: Publish auggy + engine packages to npm on tag

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

# Verification executes repository and dependency code without an npm token or
# OIDC permission. The credentialed job receives only packed artifacts and
# runs fixed workflow commands.

jobs:
  verify:
    name: Verify and pack release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_version: ${{ steps.release-metadata.outputs.version }}
      npm_tag: ${{ steps.release-metadata.outputs.npm_tag }}
      is_prerelease: ${{ steps.release-metadata.outputs.is_prerelease }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm tag commit belongs to main
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::Full checkout did not contain origin/main."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag commit $TAG_COMMIT is not reachable from origin/main."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node for release verification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Resolve exact release metadata
        id: release-metadata
        env:
          REF_NAME: ${{ github.ref_name }}
        run: bun scripts/release-metadata.ts "$REF_NAME"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run full release tests
        run: bun run test:full

      - name: Confirm all package versions match tag
        env:
          TAG_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: |
          for pkg in "package.json" \
                    "packages/anthropic/package.json" \
                    "packages/openai/package.json" \
                    "packages/openrouter/package.json" \
                    "packages/ollama/package.json" \
                    "packages/evals/package.json"; do
            PKG_VERSION="$(node -p "require('./$pkg').version")"
            PKG_NAME="$(node -p "require('./$pkg').name")"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::$PKG_NAME ($pkg) version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
              exit 1
            fi
          done

      - name: Smoke packed release
        env:
          AUGGY_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: bun run smoke:release

      - name: Upload verified package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified artifacts
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm trusted-publishing support
        run: >-
          node -e 'const {execFileSync}=require("node:child_process");
          const version=execFileSync("npm",["--version"],{encoding:"utf8"}).trim();
          const parts=version.split(".").map(Number);
          if (parts[0]<11 || (parts[0]===11 && (parts[1]<5 || (parts[1]===5 && parts[2]<1)))) {
            throw new Error(`npm ${version} is too old for trusted publishing; require >=11.5.1`);
          }
          console.log(`npm ${version} supports trusted publishing`);'

      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Publish engines first, then auggy core
        env:
          TAG_VERSION: ${{ needs.verify.outputs.release_version }}
          DIST_TAG: ${{ needs.verify.outputs.npm_tag }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: |
          publish_pkg() {
            local expected_name="$1"
            local expected_directory="$2"
            local tarball="$3"
            if [ ! -f "$tarball" ]; then
              echo "::error::Missing verified release artifact for $expected_name."
              exit 1
            fi

            if ! tar -xOf "$tarball" package/package.json |
              EXPECTED_PACKAGE_NAME="$expected_name" \
              EXPECTED_PACKAGE_VERSION="$TAG_VERSION" \
              EXPECTED_REPOSITORY_DIRECTORY="$expected_directory" \
              node -e '
                const fs = require("node:fs");
                const manifest = JSON.parse(fs.readFileSync(0, "utf8"));
                const expectedName = process.env.EXPECTED_PACKAGE_NAME;
                const expectedVersion = process.env.EXPECTED_PACKAGE_VERSION;
                const expectedDirectory = process.env.EXPECTED_REPOSITORY_DIRECTORY;
                if (manifest.name !== expectedName) {
                  throw new Error("release artifact package name does not match the fixed publish target");
                }
                if (manifest.version !== expectedVersion) {
                  throw new Error("release artifact version does not match the release tag");
                }
                if (manifest.publishConfig !== undefined) {
                  throw new Error("release artifacts must not contain publishConfig");
                }
                if (
                  manifest.repository?.url !==
                  "git+https://github.com/looselyorganized/auggy.git"
                ) {
                  throw new Error("release artifact repository does not match the trusted publisher");
                }
                if ((manifest.repository?.directory ?? "") !== expectedDirectory) {
                  throw new Error("release artifact repository directory does not match its package");
                }
              '
            then
              echo "::error::Release artifact manifest validation failed for $expected_name."
              exit 1
            fi

            local_integrity="$(node -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              const bytes = readFileSync(process.argv[1]);
              process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
            ' "$tarball")"
            published_integrity="$(node --input-type=module -e '
              const [name, version] = process.argv.slice(1);
              const packagePath = encodeURIComponent(name).replace(/^%40/, "@");
              const response = await fetch(
                `https://registry.npmjs.org/${packagePath}/${encodeURIComponent(version)}`,
                { headers: { accept: "application/vnd.npm.install-v1+json" } },
              );
              if (response.status === 404) {
                process.stdout.write("not-found");
                process.exit(0);
              }
              if (!response.ok) {
                throw new Error(`npm registry integrity lookup failed with HTTP ${response.status}`);
              }
              const metadata = await response.json();
              if (typeof metadata?.dist?.integrity !== "string") {
                throw new Error("published package metadata omitted dist.integrity");
              }
              process.stdout.write(metadata.dist.integrity);
            ' "$expected_name" "$TAG_VERSION")"

            if [ "$published_integrity" = "not-found" ]; then
              echo "  publishing verified $expected_name@$TAG_VERSION artifact"
              npm publish "$tarball" \
                --registry=https://registry.npmjs.org \
                --tag="$DIST_TAG" \
                --access=public \
                --ignore-scripts
            elif [ "$published_integrity" = "$local_integrity" ]; then
              echo "  $expected_name@$TAG_VERSION already exists with identical integrity; skipping"
            else
              echo "::error::$expected_name@$TAG_VERSION already exists with different integrity. Refusing to assemble one release from different artifacts."
              exit 1
            fi
          }

          publish_pkg "@auggy/anthropic" "packages/anthropic" "$RELEASE_ARTIFACT_DIR/auggy-anthropic-$TAG_VERSION.tgz"
          publish_pkg "@auggy/openai" "packages/openai" "$RELEASE_ARTIFACT_DIR/auggy-openai-$TAG_VERSION.tgz"
          publish_pkg "@auggy/openrouter" "packages/openrouter" "$RELEASE_ARTIFACT_DIR/auggy-openrouter-$TAG_VERSION.tgz"
          publish_pkg "@auggy/ollama" "packages/ollama" "$RELEASE_ARTIFACT_DIR/auggy-ollama-$TAG_VERSION.tgz"
          publish_pkg "@auggy/evals" "packages/evals" "$RELEASE_ARTIFACT_DIR/auggy-evals-$TAG_VERSION.tgz"
          publish_pkg "auggy" "" "$RELEASE_ARTIFACT_DIR/auggy-$TAG_VERSION.tgz"

  github_release:
    name: Publish verified GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifacts

      - name: Create checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: looselyorganized/auggy
          REF_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
          RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifacts
        run: |
          cd "$RELEASE_ARTIFACT_DIR"
          sha256sum ./*.tgz | LC_ALL=C sort > SHA256SUMS

          if existing_prerelease="$(gh release view "$REF_NAME" --json isPrerelease --jq .isPrerelease 2>/dev/null)"; then
            if [ "$existing_prerelease" != "$IS_PRERELEASE" ]; then
              echo "::error::Existing GitHub release prerelease status does not match the release tag."
              exit 1
            fi
            gh release upload "$REF_NAME" ./*.tgz ./SHA256SUMS --clobber
            exit 0
          fi

          prerelease_flags=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            prerelease_flags+=(--prerelease)
          fi
          gh release create "$REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$REF_NAME" \
            "${prerelease_flags[@]}" \
            ./*.tgz ./SHA256SUMS
