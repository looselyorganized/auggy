name: Publish auggy to npm on tag

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish auggy to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node (for `npm publish`)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: bun install

      # Read-only check: if the tagged version is already on npm, skip the rest.
      # Makes retroactive tags (e.g. backfilling v0.3.0 after a manual publish)
      # safe to push without forcing a republish that would fail with EPUBLISHCONFLICT.
      - name: Check if version already published
        id: npm-check
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          if npm view "auggy@$TAG_VERSION" version >/dev/null 2>&1; then
            echo "auggy@$TAG_VERSION already on npm; skipping rest of workflow"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "auggy@$TAG_VERSION not yet on npm; proceeding"
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.npm-check.outputs.already_published == 'false'
        run: bunx tsc --noEmit

      - name: Run tests
        if: steps.npm-check.outputs.already_published == 'false'
        run: bun test

      - name: Confirm version matches tag
        if: steps.npm-check.outputs.already_published == 'false'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # Provenance attestation (--provenance) is currently DISABLED because it
      # requires a public source repo. Re-enable when the augment-1 repo is
      # made public for OSS launch by adding `--provenance` to the publish
      # command below. See docs/RELEASING.md § "Provenance gate" for the full
      # re-enable checklist.
      - name: Publish to npm
        if: steps.npm-check.outputs.already_published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
