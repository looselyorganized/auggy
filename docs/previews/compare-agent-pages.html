<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Compare Agent Page Concepts</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2026;
      --muted: #667085;
      --line: #d9dee8;
      --page: #f6f8fb;
      --panel: #ffffff;
      --accent: #176b5d;
      --blue: #2d5f9a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    a {
      color: var(--blue);
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }

    .shell {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
      font-size: 14px;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .frame-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .frame-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .frame-title {
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .frame-purpose {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 128px);
      min-height: 620px;
      border: 0;
      background: #fff;
    }

    @media (max-width: 980px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .links {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      iframe {
        height: 760px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Compare Page Concepts</h1>
        <p>Default home versus public integration surface.</p>
      </div>
      <nav class="links" aria-label="Preview links">
        <a href="./default-home-concept.html" target="_blank" rel="noreferrer">Open default</a>
        <a href="./agent-integration-concept.html" target="_blank" rel="noreferrer">Open /agent</a>
        <a href="./page-structure-concept.html" target="_blank" rel="noreferrer">Open structure</a>
        <a href="./default-page-concept.html" target="_blank" rel="noreferrer">Open state-switcher</a>
      </nav>
    </header>

    <main class="grid">
      <section class="frame-card">
        <div class="frame-head">
          <div>
            <div class="frame-title">Default /</div>
            <div class="frame-purpose">Friendly home when no public frontend is configured.</div>
          </div>
          <a href="./default-home-concept.html" target="_blank" rel="noreferrer">New tab</a>
        </div>
        <iframe title="Default home concept" src="./default-home-concept.html"></iframe>
      </section>

      <section class="frame-card">
        <div class="frame-head">
          <div>
            <div class="frame-title">/agent</div>
            <div class="frame-purpose">Stable public integration page for developers.</div>
          </div>
          <a href="./agent-integration-concept.html" target="_blank" rel="noreferrer">New tab</a>
        </div>
        <iframe title="Agent integration concept" src="./agent-integration-concept.html"></iframe>
      </section>
    </main>
  </div>
</body>
</html>
