# Agent configuration — the source of truth for this Auggy agent.
# See docs at augment-1/docs/ for field reference.

id: aug1_4537f5fb-2b28-44a6-a94c-0a47af405d8c
name: zip
purpose: "zip agent"

engine:
  provider: anthropic
  model: claude-sonnet-4-6
  maxContextTokens: 200000
  maxTokens: 4096

settings:
  compactionStrategy: truncate
  maxInferenceLoops: 10

augments:
  - name: identity
    type: fileMemory
    options:
      label: self
      source: ./identity.md
      mutable: false
      origin: operator
      priority: required
      placement: system
      eviction: never

  - name: learned
    type: fileMemory
    options:
      label: learned
      source: ./learned.md
      mutable: true
      origin: system
      priority: high
      placement: preamble
      eviction: drop

  - name: files
    type: filesystem
    options:
      mounts:
        - name: skills
          path: ./skills
          writable: false
        - name: workspace
          path: ./workspace
          writable: true
          deletable: true

  - name: fetch
    type: webFetch
    options:
      timeoutMs: 15000

  - name: web
    type: webTransport
    options:
      port: 8080
      auth:
        type: bearer
        token: ${AUGGY_WEB_TOKEN}
