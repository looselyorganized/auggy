# Full agent — all non-external augments + manifest (6 augments, ~15 tools)
# Used by modularity-accuracy eval to test loaded agent accuracy.
# manifest uses a dummy URL — tools register but never execute (distractors).

id: aug1_00000000-0000-4000-a000-000000000003
name: eval-full
engine:
  provider: anthropic
  model: claude-sonnet-4-6
  maxTokens: 1024
settings:
  compactionStrategy: truncate
  maxInferenceLoops: 1
augments:
  - name: identity
    type: fileMemory
    options:
      label: self
      source: ./identity.md
      mutable: false
      origin: operator
      priority: required
      placement: system
      eviction: never
  - name: learned
    type: fileMemory
    options:
      label: learned
      source: ./learned.md
      mutable: true
      origin: agent
      priority: normal
      placement: context
      eviction: drop
  - name: files
    type: filesystem
    options:
      mounts:
        - name: workspace
          path: ./workspace
          writable: true
          deletable: true
  - name: fetch
    type: webFetch
    options:
      timeoutMs: 15000
  - name: bash
    type: bash
    options:
      risk: restricted
      allowedCommands: ["echo", "ls", "cat", "pwd", "date"]
      scripts:
        - name: deploy
          description: "Deploy the current build to staging"
          command: "echo deployed"
        - name: health_check
          description: "Run health checks against all services"
          command: "echo healthy"
  - name: org
    type: manifest
    options:
      baseUrl: http://localhost:0
