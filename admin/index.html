<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Auggy — Console</title>
    <script>
      // Apply theme before paint to avoid flash. Order: localStorage → system → light.
      try {
        const t =
          localStorage.getItem("auggy-theme") ?? localStorage.getItem("auggy-admin-theme");
        const dark =
          t === "dark" ||
          (t == null && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
