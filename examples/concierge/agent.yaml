# Agent configuration

id: aug1_3e4d32d3-a915-478c-8dfd-a9a1f6121fed
name: concierge
displayName: Harbor & Pine Concierge
purpose: Help visitors choose boutique services, capture leads, and escalate
  high-intent requests.
creator:
  displayName: Harbor & Pine team
identity: ./identity.md
engine:
  provider: anthropic
  model: claude-sonnet-4-6
  maxContextTokens: 200000
  maxTokens: 4096
settings:
  compactionStrategy: truncate
  maxInferenceLoops: 10
  turnScheduling:
    maxConcurrent: 4
    maxQueued: 100
    maxQueuedPerThread: 20
    maxCausalDepth: 8
augments:
  - fileMemory
  - filesystem
  - webTransport
  - webFetch
  - turnControl
  - knowledge
  - notify
  - concierge-services
